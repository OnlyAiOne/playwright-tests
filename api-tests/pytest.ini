[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers --html=reports/api-report.html --self-contained-html --junitxml=reports/junit.xml
log_level = INFO
log_format = %(asctime)s %(levelname)s %(name)s: %(message)s
markers =
    smoke: fast checks that the core APIs answer correctly
    regression: full functional coverage
    negative: invalid input, missing parameters, unsupported methods
    contract: response body validated against a JSON schema
    writes: creates, updates or deletes data (skipped when API_ALLOW_WRITES=false)
    products: product and brand catalogue APIs
    search: product search API
    auth: login verification API
    account: user account lifecycle APIs
    ui: API + Playwright UI integration (needs `playwright install chromium`)
