name: API Tests

on:
  push:
    branches: [main]
    paths: ["api-tests/**", ".github/workflows/api-tests.yml"]
  pull_request:
    branches: [main]
    paths: ["api-tests/**", ".github/workflows/api-tests.yml"]
  schedule:
    - cron: "30 1 * * *"  # daily prod health check, 07:00 IST
  workflow_dispatch:
    inputs:
      markers:
        description: "Pytest marker expression, e.g. smoke, 'not writes', 'not ui'"
        required: false
        default: ""

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api-tests
    env:
      API_ENV: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api-tests/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium for the UI integration tests
        run: python -m playwright install --with-deps chromium

      - name: Run API tests
        run: python -m pytest ${{ inputs.markers && format('-m "{0}"', inputs.markers) || '' }} --reruns 1 --reruns-delay 5

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: api-tests/reports/
          retention-days: 14
